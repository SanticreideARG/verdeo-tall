server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    # ─── LOGS ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/verdeo_access.log;
    error_log  /var/log/nginx/verdeo_error.log;

    # ─── SEGURIDAD ──────────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # ─── ARCHIVOS ESTATICOS ─────────────────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|css|woff|woff2|ttf|svg)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # JS served separately: may be dynamically generated (e.g. Livewire), so
    # fall through to PHP instead of caching misses as 404.
    location ~* \.js$ {
        try_files $uri /index.php?$query_string;
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ─── LARAVEL ────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass   laravel-app:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }

    # ─── RUTAS ESPECIALES VERDEO ─────────────────────────────────────────────
    # Hoja de ruta del repartidor (sin login)
    location /ruta/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Encuesta post-entrega (sin login)
    location /encuesta/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    client_max_body_size 20M;
}