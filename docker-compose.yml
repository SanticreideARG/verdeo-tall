services:

  # ─── NGINX ──────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: verdeo_nginx
    restart: unless-stopped
    ports:
      - "8888:80"
      - "443:443"
    volumes:
      - ./laravel:/var/www/html
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /mnt/d/verdeo-docker/certbot:/etc/letsencrypt
    depends_on:
      laravel-app:
        condition: service_started
      typescript-api:
        condition: service_healthy
    networks:
      - verdeo_net

  # ─── LARAVEL ────────────────────────────────────────────────────────────────
  laravel-app:
    build:
      context: ./laravel
      dockerfile: Dockerfile
    container_name: verdeo_laravel
    restart: unless-stopped
    volumes:
      - ./laravel:/var/www/html
    environment:
      - APP_ENV=${APP_ENV}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SESSION_DB=${REDIS_SESSION_DB:-2}
      - SESSION_DRIVER=${SESSION_DRIVER:-redis}
      - SESSION_CONNECTION=${SESSION_CONNECTION:-session}
      - SESSION_COOKIE=${SESSION_COOKIE:-verdeo_session}
      - SESSION_SECURE_COOKIE=${SESSION_SECURE_COOKIE:-false}
      - SESSION_SAME_SITE=${SESSION_SAME_SITE:-lax}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdeo_net

  # ─── TYPESCRIPT API (MIGRACIÓN INCREMENTAL) ─────────────────────────────────
  typescript-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: verdeo_typescript_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      - HOST=0.0.0.0
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-local-development-token-change-me}
      - EVOLUTION_WEBHOOK_SECRET=${EVOLUTION_API_KEY}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-verdeo_messaging}
      - POSTGRES_USER=${POSTGRES_USER:-verdeo_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - LEGACY_TIMEZONE_OFFSET=${LEGACY_TIMEZONE_OFFSET:--03:00}
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - verdeo_net

  # ─── MYSQL 8 ────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: verdeo_mysql
    restart: unless-stopped
    command: --skip-ssl --default-authentication-plugin=mysql_native_password --sha256_password_auto_generate_rsa_keys=OFF --caching_sha2_password_auto_generate_rsa_keys=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - verdeo_mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - verdeo_net

  # ─── POSTGRESQL (DESTINO DE LA MIGRACIÓN) ───────────────────────────────────
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    container_name: verdeo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-verdeo_messaging}
      POSTGRES_USER: ${POSTGRES_USER:-verdeo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - verdeo_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - verdeo_net

  # ─── REDIS ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: verdeo_redis
    restart: unless-stopped
    volumes:
      - verdeo_redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - verdeo_net

  # ─── N8N ────────────────────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:2.18.5@sha256:2d70fafea7c0c397f40df30daa31243c0bff590e9e87e0430398e7cb4d3d8d0b
    container_name: verdeo_n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://${N8N_HOST}:5678
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - DB_TYPE=sqlite
    volumes:
      - /mnt/d/verdeo-docker/n8n:/home/node/.n8n
      - ./n8n/workflows:/workflows
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - verdeo_net

  # ─── EVOLUTION API ──────────────────────────────────────────────────────────
  evolution-api:
    image: atendai/evolution-api@sha256:1a69aaeea408ccf753e8c9ad5fa91146a478ce4d3609577fd73ad2c52e69f8ae
    container_name: verdeo_evolution
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SERVER_URL=http://evolution-api:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=mysql
      - DATABASE_CONNECTION_URI=mysql://${DB_USERNAME}:${DB_PASSWORD}@mysql:3306/verdeo_evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/6
      - CACHE_REDIS_PREFIX_KEY=verdeo
      - CACHE_REDIS_SAVE_INSTANCES=true
      - CACHE_LOCAL_ENABLED=false
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://typescript-api:3000/v1/webhooks/evolution
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - WEBHOOK_EVENTS_APPLICATION_STARTUP=false
      - WEBHOOK_EVENTS_QRCODE_UPDATED=false
      - WEBHOOK_EVENTS_MESSAGES_SET=false
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_MESSAGES_UPDATE=true
      - WEBHOOK_EVENTS_MESSAGES_DELETE=true
      - WEBHOOK_EVENTS_SEND_MESSAGE=false
      - WEBHOOK_EVENTS_CONTACTS_SET=false
      - WEBHOOK_EVENTS_CONTACTS_UPSERT=false
      - WEBHOOK_EVENTS_CONTACTS_UPDATE=false
      - WEBHOOK_EVENTS_PRESENCE_UPDATE=false
      - WEBHOOK_EVENTS_CHATS_SET=false
      - WEBHOOK_EVENTS_CHATS_UPSERT=false
      - WEBHOOK_EVENTS_CHATS_UPDATE=false
      - WEBHOOK_EVENTS_CHATS_DELETE=false
      - WEBHOOK_EVENTS_GROUPS_UPSERT=false
      - WEBHOOK_EVENTS_GROUPS_UPDATE=false
      - WEBHOOK_EVENTS_GROUP_PARTICIPANTS_UPDATE=false
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=false
      - WEBHOOK_EVENTS_CALL=false
      - WEBHOOK_EVENTS_TYPEBOT_START=false
      - WEBHOOK_EVENTS_TYPEBOT_CHANGE_STATUS=false
      - WEBHOOK_EVENTS_ERRORS=false
    volumes:
      - /mnt/d/verdeo-docker/evolution:/evolution/instances
      - ./evolution-api/config:/evolution/config
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdeo_net

  # ─── OLLAMA (DESACTIVADO — reemplazado por APIs cloud: Claude/GPT/Gemini) ───
  # ollama:
  #   image: ollama/ollama
  #   container_name: verdeo_ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - /mnt/d/verdeo-docker/ollama:/root/.ollama
  #   networks:
  #     - verdeo_net

  # ─── QUEUE WORKER ───────────────────────────────────────────────────────────
  queue-worker:
    build:
      context: ./laravel
      dockerfile: Dockerfile
    container_name: verdeo_queue
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - ./laravel:/var/www/html
    environment:
      - APP_ENV=${APP_ENV}
      - DB_HOST=mysql
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdeo_net

  # ─── SCHEDULER ──────────────────────────────────────────────────────────────
  scheduler:
    build:
      context: ./laravel
      dockerfile: Dockerfile
    container_name: verdeo_scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction &
        sleep 60
      done"
    volumes:
      - ./laravel:/var/www/html
    environment:
      - APP_ENV=${APP_ENV}
      - DB_HOST=mysql
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdeo_net

# ─── NETWORKS ───────────────────────────────────────────────────────────────
networks:
  verdeo_net:
    driver: bridge

# ─── VOLUMES ────────────────────────────────────────────────────────────────
volumes:
  verdeo_mysql_data:
  verdeo_postgres_data:
  verdeo_redis_data:
