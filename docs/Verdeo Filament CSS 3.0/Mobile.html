<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Verdeo Mobile · Cliente &amp; Colaborador</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: 'Barlow', system-ui, sans-serif; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="verdeo-mobile-ui.jsx"></script>
<script type="text/babel" src="cliente-app.jsx"></script>
<script type="text/babel" src="colaborador-app.jsx"></script>

<script type="text/babel">
const { useState } = React;

const PhoneCard = ({ children, label, sub }) => (
  <div style={{
    display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14,
  }}>
    <div style={{ textAlign: 'center' }}>
      <div style={{
        fontFamily: "'Barlow Condensed', sans-serif", fontSize: 20,
        fontWeight: 700, letterSpacing: 0.5, color: '#1a2536',
      }}>{label}</div>
      <div style={{ fontSize: 12, color: 'rgba(60,50,40,0.55)', marginTop: 2 }}>{sub}</div>
    </div>
    <IOSDevice width={380} height={820} dark={true}>
      {children}
    </IOSDevice>
  </div>
);

const App = () => (
  <DesignCanvas>
    <DCSection id="apps" title="Verdeo Mobile" subtitle="Mobile-first · Glassmorphic leaf dock · Tocá el FAB ✚">
      <DCArtboard id="cliente" label="Cliente · Lucía" width={420} height={920}>
        <PhoneCard label="App Cliente" sub="Pedido activo · re-orden rápido">
          <ClienteApp />
        </PhoneCard>
      </DCArtboard>
      <DCArtboard id="colaborador" label="Colaborador · Mateo" width={420} height={920}>
        <PhoneCard label="App Colaborador" sub="Ruta del día · próximas entregas">
          <ColaboradorApp />
        </PhoneCard>
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
