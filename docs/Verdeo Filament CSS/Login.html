<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verdeo — Acceso</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:      #0b1828;
      --green:     #3a7d44;
      --green-lt:  #4e9e5a;
      --white:     #f0f4f0;
      --muted:     rgba(240,244,240,0.45);
      --glass-bg:  rgba(11,24,40,0.72);
      --glass-bdr: rgba(58,125,68,0.35);
    }
    html, body {
      height: 100%;
      background: var(--navy);
      font-family: 'Barlow', sans-serif;
      color: var(--white);
      overflow: hidden;
    }
    #bg { position: fixed; inset: 0; z-index: 0; }
    .stage {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%; max-width: 460px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-bdr);
      border-radius: 20px;
      padding: 44px 40px 40px;
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(58,125,68,0.12),
        0 24px 60px rgba(0,0,0,0.55),
        0 0 80px rgba(58,125,68,0.07) inset;
      position: relative; overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(78,158,90,0.7), transparent);
    }
    .logo-wrap { display: flex; justify-content: center; margin-bottom: 28px; }
    .logo-img {
      width: 96px; height: 96px; border-radius: 50%;
      filter: drop-shadow(0 4px 18px rgba(58,125,68,0.45));
      transition: filter 0.4s ease, transform 0.4s ease;
      cursor: pointer;
    }
    .logo-img:hover {
      filter: drop-shadow(0 6px 28px rgba(78,158,90,0.7));
      transform: scale(1.04) rotate(-1deg);
    }
    .tabs {
      display: flex; gap: 0;
      border-radius: 10px; background: rgba(255,255,255,0.05);
      padding: 4px; margin-bottom: 32px;
    }
    .tab-btn {
      flex: 1; padding: 10px 0; border: none; border-radius: 7px;
      background: transparent; color: var(--muted);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px; font-weight: 600; letter-spacing: 1.2px;
      text-transform: uppercase; cursor: pointer;
      transition: background 0.25s, color 0.25s, box-shadow 0.25s;
    }
    .tab-btn.active {
      background: var(--green); color: #fff;
      box-shadow: 0 2px 14px rgba(58,125,68,0.45);
    }
    .tab-btn:not(.active):hover { color: var(--white); background: rgba(58,125,68,0.15); }
    .form-panel { display: none; }
    .form-panel.active { display: block; }
    .field { margin-bottom: 18px; }
    .field label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: 1.4px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px; transition: color 0.2s;
    }
    .field:focus-within label { color: var(--green-lt); }
    .field input {
      width: 100%; padding: 13px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; color: var(--white);
      font-family: 'Barlow', sans-serif; font-size: 15px; outline: none;
      transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
    }
    .field input::placeholder { color: rgba(240,244,240,0.25); }
    .field input:hover { border-color: rgba(78,158,90,0.4); background: rgba(255,255,255,0.07); }
    .field input:focus {
      border-color: var(--green-lt); background: rgba(58,125,68,0.08);
      box-shadow: 0 0 0 3px rgba(58,125,68,0.18), 0 0 20px rgba(58,125,68,0.1);
    }
    .btn-primary {
      width: 100%; margin-top: 8px; padding: 15px; border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #3a7d44 0%, #4e9e5a 60%, #3a7d44 100%);
      background-size: 200% 200%; background-position: 100% 100%;
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer;
      transition: background-position 0.45s, box-shadow 0.35s, transform 0.2s;
      box-shadow: 0 4px 18px rgba(58,125,68,0.3);
      position: relative; overflow: hidden;
    }
    .btn-primary::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.12) 50%, transparent 70%);
      transform: translateX(-100%); transition: transform 0.5s ease;
    }
    .btn-primary:hover {
      background-position: 0% 0%;
      box-shadow: 0 6px 28px rgba(58,125,68,0.55), 0 0 40px rgba(78,158,90,0.2);
      transform: translateY(-2px);
    }
    .btn-primary:hover::after { transform: translateX(100%); }
    .btn-primary:active { transform: translateY(0); }
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 22px 0; color: var(--muted);
      font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.08);
    }
    .btn-ghost {
      width: 100%; padding: 12px; background: transparent;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
      color: var(--muted); font-family: 'Barlow', sans-serif;
      font-size: 13px; font-weight: 500; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: border-color 0.25s, color 0.25s, background 0.25s, transform 0.2s;
      margin-bottom: 10px;
    }
    .btn-ghost:hover {
      border-color: rgba(78,158,90,0.5); color: var(--white);
      background: rgba(58,125,68,0.1); transform: translateY(-1px);
    }
    .card-footer {
      margin-top: 24px; text-align: center;
      font-size: 12px; color: var(--muted);
    }
    .card-footer a {
      color: var(--green-lt); text-decoration: none;
      font-weight: 600; transition: color 0.2s;
    }
    .card-footer a:hover { color: #fff; }
    .forgot { text-align: right; margin-top: -10px; margin-bottom: 18px; }
    .forgot a {
      font-size: 11px; color: var(--muted); text-decoration: none;
      letter-spacing: 0.5px; transition: color 0.2s;
    }
    .forgot a:hover { color: var(--green-lt); }
    @media (max-width: 480px) {
      .card { padding: 36px 24px 32px; border-radius: 16px; }
      .logo-img { width: 80px; height: 80px; }
      html, body { overflow: auto; }
    }
  </style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="stage">
  <div class="card">

    <div class="logo-wrap">
      <img src="verdeo-logo-crop.png" alt="Verdeo" class="logo-img" />
    </div>

    <div class="tabs" role="tablist">
      <button class="tab-btn active" id="tab-login" role="tab" onclick="switchTab('login')">Iniciar Sesión</button>
      <button class="tab-btn" id="tab-register" role="tab" onclick="switchTab('register')">Registrarse</button>
    </div>

    <!-- Login -->
    <div class="form-panel active" id="panel-login">
      <div class="field">
        <label for="login-email">Correo electrónico</label>
        <input type="email" id="login-email" placeholder="tu@email.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="login-pass">Contraseña</label>
        <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <div class="forgot"><a href="#">¿Olvidaste tu contraseña?</a></div>
      <button class="btn-primary" onclick="handleLogin()">Iniciar Sesión</button>
      <div class="divider">o continuar con</div>
      <button class="btn-ghost">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continuar con Google
      </button>
    </div>

    <!-- Register -->
    <div class="form-panel" id="panel-register">
      <div class="field">
        <label for="reg-name">Nombre completo</label>
        <input type="text" id="reg-name" placeholder="Tu nombre" autocomplete="name" />
      </div>
      <div class="field">
        <label for="reg-email">Correo electrónico</label>
        <input type="email" id="reg-email" placeholder="tu@email.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="reg-pass">Contraseña</label>
        <input type="password" id="reg-pass" placeholder="Mínimo 8 caracteres" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="reg-pass2">Confirmar contraseña</label>
        <input type="password" id="reg-pass2" placeholder="Repetir contraseña" autocomplete="new-password" />
      </div>
      <button class="btn-primary" onclick="handleRegister()">Crear Cuenta</button>
    </div>

    <div class="card-footer">
      <span id="footer-text">¿No tenés cuenta? </span>
      <a href="#" id="footer-link" onclick="switchTab('register'); return false;">Registrate gratis</a>
    </div>

  </div>
</div>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
  const ft = document.getElementById('footer-text');
  const fl = document.getElementById('footer-link');
  if (tab === 'login') {
    ft.textContent = '¿No tenés cuenta? ';
    fl.textContent = 'Registrate gratis';
    fl.onclick = () => { switchTab('register'); return false; };
  } else {
    ft.textContent = '¿Ya tenés cuenta? ';
    fl.textContent = 'Iniciá sesión';
    fl.onclick = () => { switchTab('login'); return false; };
  }
}

function goToCheckEmail(email) {
  const btn = event.currentTarget;
  btn.style.opacity = '0.7';
  setTimeout(() => {
    window.location.href = 'Check Email.html?email=' + encodeURIComponent(email || 'tucasilla@tucasilla.com');
  }, 900);
}

function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const btn = document.querySelector('#panel-login .btn-primary');
  btn.textContent = 'Ingresando…';
  btn.style.opacity = '0.7';
  setTimeout(() => {
    window.location.href = 'Check Email.html?email=' + encodeURIComponent(email || 'tu@email.com');
  }, 900);
}

function handleRegister() {
  const email = document.getElementById('reg-email').value.trim();
  const btn = document.querySelector('#panel-register .btn-primary');
  btn.textContent = 'Creando cuenta…';
  btn.style.opacity = '0.7';
  setTimeout(() => {
    window.location.href = 'Check Email.html?email=' + encodeURIComponent(email || 'tu@email.com');
  }, 900);
}

/* ── Particles ── */
(function() {
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  const COLORS = ['#3a7d44','#4e9e5a','#c8a030','#8ab4c8','#2d6e38'];
  let W, H, particles, mouse = { x: -9999, y: -9999 };
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  function Particle() {
    this.x = Math.random()*W; this.y = Math.random()*H;
    this.vx = (Math.random()-.5)*.4; this.vy = (Math.random()-.5)*.4;
    this.r = Math.random()*1.8+.6;
    this.color = COLORS[Math.floor(Math.random()*COLORS.length)];
    this.alpha = Math.random()*.5+.2;
  }
  function init() {
    resize();
    particles = Array.from({length: Math.min(120, Math.floor(W*H/12000))}, () => new Particle());
  }
  function draw() {
    ctx.clearRect(0,0,W,H);
    const maxD = 130;
    for (let i=0; i<particles.length; i++) {
      const a = particles[i];
      for (let j=i+1; j<particles.length; j++) {
        const b = particles[j], dx=a.x-b.x, dy=a.y-b.y, d=Math.sqrt(dx*dx+dy*dy);
        if (d<maxD) { ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.strokeStyle=`rgba(58,125,68,${.12*(1-d/maxD)})`; ctx.lineWidth=.6; ctx.stroke(); }
      }
      const mx=a.x-mouse.x, my=a.y-mouse.y, md=Math.sqrt(mx*mx+my*my);
      if (md<120) { ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(mouse.x,mouse.y); ctx.strokeStyle=`rgba(78,158,90,${.18*(1-md/120)})`; ctx.lineWidth=.8; ctx.stroke(); }
    }
    for (const p of particles) {
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.color; ctx.globalAlpha=p.alpha; ctx.fill(); ctx.globalAlpha=1;
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0)p.x=W; if(p.x>W)p.x=0; if(p.y<0)p.y=H; if(p.y>H)p.y=0;
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', init);
  window.addEventListener('mousemove', e => { mouse.x=e.clientX; mouse.y=e.clientY; });
  window.addEventListener('touchmove', e => { mouse.x=e.touches[0].clientX; mouse.y=e.touches[0].clientY; }, {passive:true});
  init(); draw();
})();
</script>
</body>
</html>
